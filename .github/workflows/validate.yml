name: Validate language packs
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/translate.py validate
      - run: |
          python3 scripts/translate.py registry
          git diff --exit-code -- community-plugins.json
